{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Weblog</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                url("{% static 'blog/images/auth-bg.jpg' %}") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: #fff;
            padding: 42px 40px;
            border-radius: 4px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fbb900;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .logo h2 {
            margin-top: 10px;
            margin-bottom: 0;
            color: #071426;
            font-size: 25px;
            font-weight: 700;
        }

        .auth-title {
            text-align: center;
            color: #071426;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-description {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;
            border: 1px solid #e5e5e5;
            border-radius: 2px;
            padding: 0 14px;
            font-size: 13px;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #fbb900;
            box-shadow: 0 0 0 2px rgba(251, 185, 0, 0.12);
        }

        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 2px;
            background: #fbb900;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            transition: .2s;
        }

        .login-btn:hover {
            background: #e5a800;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 22px;
            font-size: 12px;
        }

        .remember-row label {
            color: #777;
        }

        .forgot-password {
            color: #fbb900;
            text-decoration: none;
        }

        .forgot-password:hover {
            color: #071426;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #888;
        }

        .auth-footer a {
            color: #fbb900;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background: #fff1f1;
            color: #d9534f;
            padding: 10px 12px;
            margin-bottom: 18px;
            font-size: 12px;
            border-left: 3px solid #d9534f;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="logo">
            <div class="logo-icon">
                T
            </div>

            <h2>Travelista</h2>
        </div>

        <h1 class="auth-title">Welcome Back</h1>

        <p class="auth-description">
            Login to continue your journey with us.
        </p>

        {% if form.errors %}
            <div class="error-message">
                Username or password is incorrect.
            </div>
        {% endif %}

        <form method="post" action="{% url "accounts:login" %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div>
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="remember-row">

                <label>
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="#">
                Create Account
            </a>
        </div>

    </div>

</div>

</body>
</html>
