{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Travelista</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.65)
                ),
                url("{% static 'img/auth-bg.jpg' %}")
                center/cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: #fff;
            padding: 42px 40px;
            border-radius: 4px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.3);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: #fbb900;
            color: #fff;

            border-radius: 50%;

            font-size: 20px;
            font-weight: bold;
        }

        .logo h2 {
            margin-top: 10px;
            margin-bottom: 0;

            color: #071426;
            font-size: 25px;
            font-weight: 700;
        }

        /* Title */
        .auth-title {
            text-align: center;

            color: #071426;

            font-size: 26px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .auth-description {
            text-align: center;

            color: #888;

            font-size: 13px;
            line-height: 1.7;

            margin-bottom: 28px;
        }

        /* Form */
        .form-label {
            font-size: 13px;
            font-weight: 600;

            color: #333;

            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;

            border: 1px solid #e5e5e5;
            border-radius: 2px;

            padding: 0 14px;

            font-size: 13px;

            box-shadow: none;
        }

        .form-control:focus {
            border-color: #fbb900;

            box-shadow:
                0 0 0 2px rgba(251, 185, 0, 0.12);
        }

        /* Button */
        .reset-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 2px;

            background: #fbb900;
            color: #fff;

            font-size: 13px;
            font-weight: 600;

            margin-top: 8px;

            transition: .2s;
        }

        .reset-btn:hover {
            background: #e5a800;
        }

        /* Back to Login */
        .auth-footer {
            text-align: center;

            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid #eee;

            font-size: 13px;
            color: #888;
        }

        .auth-footer a {
            color: #fbb900;

            text-decoration: none;

            font-weight: 600;
        }

        .auth-footer a:hover {
            color: #071426;
        }

        /* Small text */
        .help-text {
            margin-top: 8px;

            color: #999;

            font-size: 11px;
            line-height: 1.6;
        }

        /* Error */
        .error-message {
            background: #fff1f1;

            color: #d9534f;

            padding: 10px 12px;

            margin-bottom: 18px;

            font-size: 12px;

            border-left: 3px solid #d9534f;
        }

        @media (max-width: 480px) {

            .auth-card {
                padding: 35px 25px;
            }

            .auth-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-icon">
                T
            </div>

            <h2>
                Travelista
            </h2>

        </div>


        <!-- Title -->
        <h1 class="auth-title">
            Forgot Password?
        </h1>



        <!-- Form -->
        <form method="POST" action="{% url 'accounts:forgot_password' %}">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    username
                </label>

                <input
                    type="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >



            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password1"
                    class="form-control"
                    placeholder="Enter your new password"
                    required
                >



            </div>

            <div class="mb-3">

                <label class="form-label">
                   confirm Password
                </label>

                <input
                    type="password"
                    name="password2"
                    class="form-control"
                    placeholder="confirm your password"
                    required
                >



            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                 RESET PASSWORD
            </button>

        </form>


        <!-- Footer -->
        <div class="auth-footer">

            Remember your password?

            <a href="{% url "accounts:login" %}">
                Back to Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
